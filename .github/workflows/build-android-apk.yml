name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Android platform files
        run: flutter create --platforms=android --org com.streambox --project-name streambox .

      - name: Configure Android for streaming
        run: python3 tool/configure_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build release AAB
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Rename APK with version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/version: .*+//' )
          cp build/app/outputs/flutter-apk/app-release.apk "StreamBox-atual-${BUILD}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamBox-atual
          path: StreamBox-atual-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: streambox-google-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
