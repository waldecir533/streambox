name: streambox
version: 0.5.1+7
publish_to: 'none'
description: Flutter MVP for playing user-provided, authorized M3U/HLS streams.

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  video_player: ^2.13.0
  flutter_vlc_player: ^7.4.4
  flutter_chrome_cast: ^1.4.6
  android_intent_plus: ^6.0.0
  shared_preferences: ^2.5.3
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
